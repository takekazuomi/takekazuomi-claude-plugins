[tools]
node = "24"

[env]
# 対象スキル一覧。install / uninstall / list が参照する
SKILLS = "bash-script-template go-project-scaffold go-pr-review memo-capture mysql-container-setup pr-workflow workspace writing-style"

[tasks.install]
quiet = true
description = "全スキルを ~/.claude/skills へ symlink で導入（実行した作業ツリーを指すよう張り替える）"
run = """
skills_dir="${SKILLS_DIR:-$HOME/.claude/skills}"
mkdir -p "$skills_dir"
failed=0
for skill in $SKILLS; do
  target="{{config_root}}/plugins/$skill/skills/$skill"
  link="$skills_dir/$skill"
  if [ -L "$link" ]; then
    current="$(readlink "$link")"
    [ "$current" = "$target" ] && continue
    # -n は必須。付けないと、既存リンクの指す先ディレクトリの中にリンクを作る
    ln -sfn "$target" "$link"
    echo "張り替え: $skill ($current)"
  elif [ -e "$link" ]; then
    echo "エラー: $link は symlink ではない。手動で確認" >&2
    failed=1
  else
    ln -s "$target" "$link"
  fi
done
exit $failed
"""

[tasks.uninstall]
quiet = true
description = "全スキルの symlink を削除"
run = """
skills_dir="${SKILLS_DIR:-$HOME/.claude/skills}"
for skill in $SKILLS; do
  if [ -L "$skills_dir/$skill" ]; then
    rm "$skills_dir/$skill"
    echo "削除: $skill"
  fi
done
"""

[tasks.list]
quiet = true
description = "スキルのインストール状態を表示"
run = """
skills_dir="${SKILLS_DIR:-$HOME/.claude/skills}"
for skill in $SKILLS; do
  if [ -L "$skills_dir/$skill" ]; then
    echo "[インストール済] $skill"
  else
    echo "[未インストール] $skill"
  fi
done
"""

[tasks.lint]
quiet = true
description = "Markdown の lint（markdownlint + textlint）"
run = [
  "npx --no-install markdownlint-cli2 \"**/*.md\" \"#node_modules\"",
  "npx --no-install textlint --config plugins/writing-style/skills/writing-style/textlint/formal.json $(git ls-files '*.md')",
]
